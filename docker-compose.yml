services:
  emresandikci:
    image: ${IMAGE:-ghcr.io/emresandikci/emresandikci.com}:${TAG:-latest}
    pull_policy: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-coolify}"
      - "traefik.http.routers.emresandikci.rule=Host(`${APP_HOST}`)"
      - "traefik.http.services.emresandikci.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-coolify}
